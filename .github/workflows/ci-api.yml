name: CI - Build and Test RaceDay

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build API + MVC web app and run all tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution (API, Web and Tests)
        run: dotnet restore RaceDay.slnx

      - name: Build solution in Release
        run: dotnet build RaceDay.slnx --no-restore --configuration Release

      - name: Run all xUnit tests
        run: dotnet test RaceDay.slnx --no-build --configuration Release --verbosity normal

      - name: Publish MVC and API (container-ready artefacts)
        run: |
          set -e
          dotnet publish src/RaceDay.Web/RaceDay.Web.csproj -c Release -o ./artifacts/web --no-restore
          dotnet publish src/RaceDay.Api/RaceDay.Api.csproj -c Release -o ./artifacts/api --no-restore
          test -f artifacts/web/RaceDay.Web.dll
          test -f artifacts/api/RaceDay.Api.dll

      - name: Validate Part 1 docs structure
        run: |
          set -e
          [ -f docs/RaceDay_ERD.png ] || { echo "::error::ERD missing"; exit 1; }
          [ -f docs/api-endpoint-plan.md ] || { echo "::error::Endpoint plan missing"; exit 1; }
          [ -f docs/RaceDayDatabase.sql ] || { echo "::error::SQL script missing"; exit 1; }
          tables=$(grep -icE "^[[:space:]]*CREATE TABLE" docs/RaceDayDatabase.sql || true)
          [ "$tables" -ge 6 ] || { echo "::error::Only $tables tables"; exit 1; }
          echo "Docs OK ($tables tables)"

      - name: Validate Part 3 MVC and Docker structure
        run: |
          set -euo pipefail
          files=(
            src/RaceDay.Web/RaceDay.Web.csproj
            src/RaceDay.Web/Program.cs
            src/RaceDay.Web/Services/ApiClient.cs
            src/RaceDay.Web/Controllers/OrganiserController.cs
            src/RaceDay.Web/Controllers/ParticipantController.cs
            src/RaceDay.Web/Views/Shared/_Layout.cshtml
            src/RaceDay.Web/wwwroot/css/site.css
            Dockerfile
            Dockerfile.api
            docker-compose.yml
            docs/part3-schema-extension.sql
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          views=$(find src/RaceDay.Web/Views -name '*.cshtml' | wc -l)
          [ "$views" -ge 15 ] || { echo "::error::Only $views Razor views"; exit 1; }
          echo "Part 3 structure OK ($views Razor views, API + MVC publish succeeded)"
