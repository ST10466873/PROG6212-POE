# RaceDay full stack: MVC web app -> RESTful API -> SQL Server.
# Start everything with: docker compose up --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://api:8080
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__RaceDay=Server=db;Database=RaceDay;User Id=sa;Password=RaceDay123!;TrustServerCertificate=True
      # Leave blank to use the API's local development image store; supply a real
      # connection string to switch the same code path to Azure Blob Storage.
      - AzureStorage__ConnectionString=${AZURE_STORAGE_CONNECTION_STRING:-}
      - AzureStorage__ContainerName=${AZURE_STORAGE_CONTAINER:-raceday-images}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=RaceDay123!
    ports:
      - "1433:1433"
    volumes:
      - raceday_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RaceDay123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  raceday_data:
